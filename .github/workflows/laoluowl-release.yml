name: Publish Laoluowl release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag, for example v1.5.7
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: laoluowl-release
  cancel-in-progress: false

jobs:
  packages:
    if: github.repository == 'laoluonb/rustdesk' && github.ref == 'refs/heads/laoluowl-client'
    uses: ./.github/workflows/flutter-build.yml
    permissions:
      contents: write
    with:
      upload-artifact: true
      artifacts-only: true
      upload-tag: ${{ inputs.tag }}

  publish:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download native packages from this build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{publish-*,rustdesk-ios-unsigned}'
          path: artifacts

      - name: Check packages and write SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v1\.5\.7$ ]]
          mkdir release-assets
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            test -s "$file"
            if [[ -e "release-assets/$name" ]]; then
              cmp "$file" "release-assets/$name"
            else
              cp "$file" "release-assets/$name"
            fi
          done < <(find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.apk' -o -name '*.ipa' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.AppImage' -o -name '*.flatpak' -o -name '*.pkg.tar.zst' \
            -o -name 'rustdesk.sbom.json' \) -print0)
          cd release-assets
          for package in rustdesk-1.5.7-{x86_64,aarch64}.{msi,exe,dmg,deb} \
            rustdesk-1.5.7-{armv7,x86_64,aarch64,universal}.apk rustdesk-ios-unsigned.ipa; do
            test -s "$package"
          done
          sha256sum -- * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish verified packages as one release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>release-error.log; then
            jq -e '.isDraft' existing-release.json
          else
            cat > release-notes.md <<'NOTES'
          - 新品牌「蓝花远控 · BlueBloom Remote」，发行者 laoluonb，基于 RustDesk 开源项目；保留上游许可和版权说明。
          - 使用蓝色花朵图标。桌面图标保留透明背景；iOS 图标按平台要求使用浅蓝底。
          - 桌面/手机「关于」页面与桌面「常规」页面新增检查更新，启动检查可在设置中关闭。新版本提示读取 laoluonb/rustdesk 的稳定 Releases，显示更新说明及当前平台安装包，点击后由浏览器下载并手动安装。
          - 更新检查不再使用 RustDesk 官方源，也不会自动安装官方客户端。下载通过 HTTPS，发布页提供 SHA256SUMS.txt；没有绕过系统安装签名检查。
          - 保留 v1.5.6 的设备别名、适应窗口修复、质量监测、默认配置、自定义壁纸与自建服务器设置。服务名称、协议、包标识和配置目录保留兼容旧版，部分系统路径仍显示 RustDesk。
          - Windows 包未提供受信任代码签名；macOS 包未公证；Android 保持现有调试签名，跨版本可能无法覆盖安装，请先备份配置。iOS IPA 需要用户自行签名。此版本没有生成或替换发布证书。
          - 安装包保持 rustdesk 文件名前缀以兼容既有发布流程。新增检查更新功能适用于 Flutter 客户端，Linux/Windows Sciter 旧界面请从 Releases 手动更新。
          NOTES
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "蓝花远控 BlueBloom Remote ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release view "$RELEASE_TAG" --json databaseId,targetCommitish > release.json
          jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' release.json
          release_id=$(jq -er '.databaseId' release.json)
          gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" > uploaded.json
          jq -r '.[].name' uploaded.json | LC_ALL=C sort > uploaded-names.txt
          ls -1 release-assets | LC_ALL=C sort > expected-names.txt
          diff -u expected-names.txt uploaded-names.txt
          while read -r digest filename; do
            remote_digest=$(jq -er --arg name "$filename" '.[] | select(.name == $name) | .digest' uploaded.json)
            test "$remote_digest" = "sha256:$digest"
          done < release-assets/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
