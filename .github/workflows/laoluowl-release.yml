name: Publish Laoluowl release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag, for example v1.5.8
        required: true
        type: string
      source-run:
        description: Optional completed run to recover AppImage packaging from (same application source)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: laoluowl-release-${{ inputs.source-run }}
  cancel-in-progress: false

jobs:
  packages:
    if: inputs.source-run == '' && github.repository == 'laoluonb/rustdesk' && github.ref == 'refs/heads/laoluowl-client'
    uses: ./.github/workflows/flutter-build.yml
    permissions:
      contents: write
    with:
      upload-artifact: true
      artifacts-only: true
      upload-tag: ${{ inputs.tag }}

  recover-appimage:
    if: inputs.source-run != '' && github.repository == 'laoluonb/rustdesk' && github.ref == 'refs/heads/laoluowl-client'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source-run }}
      VERSION: 1.5.8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify reused binaries have identical application source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          jq -e '.path == ".github/workflows/laoluowl-release.yml" and .head_branch == "laoluowl-client"' source-run.json
          source_sha=$(jq -er '.head_sha' source-run.json)
          gh api "repos/$GH_REPO/compare/$source_sha...$GITHUB_SHA" > changes.json
          jq -e '.status == "ahead" or .status == "identical"' changes.json
          jq -e '[.files[].filename | select(. != ".github/workflows/laoluowl-release.yml" and . != ".github/workflows/flutter-build.yml" and . != "appimage/AppImageBuilder-x86_64.yml" and . != "appimage/AppImageBuilder-aarch64.yml")] | length == 0' changes.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rustdesk-${{ env.VERSION }}-${{ matrix.arch }}.deb
          path: appimage
          run-id: ${{ inputs.source-run }}
          github-token: ${{ github.token }}
      - name: Build versioned AppImage from verified Debian package
        shell: bash
        run: |
          set -euo pipefail
          test "$(dpkg-deb -f appimage/rustdesk-$VERSION-${{ matrix.arch }}.deb Version)" = "$VERSION"
          mv appimage/rustdesk-$VERSION-${{ matrix.arch }}.deb appimage/rustdesk.deb
          sudo apt-get update -y
          sudo apt-get install -y libarchive-tools libfuse2
          sudo pip3 install "setuptools_scm<10"
          sudo pip3 install git+https://github.com/rustdesk-org/appimage-builder.git
          cd appimage
          sed -i "s/^    version:.*/    version: $VERSION/" AppImageBuilder-${{ matrix.arch }}.yml
          ./build-apprun.sh ${{ matrix.arch }}
          sudo appimage-builder --skip-tests --recipe ./AppImageBuilder-${{ matrix.arch }}.yml
          cmp AppDir/AppRun appimage-build/AppRun/v2.0.0/AppRun-Release-${{ matrix.arch }}
          test -s rustdesk-$VERSION-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-appimage-package-recovered-${{ matrix.arch }}
          path: appimage/rustdesk-${{ env.VERSION }}-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  publish:
    needs: [packages, recover-appimage]
    if: always() && (needs.packages.result == 'success' || needs.recover-appimage.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Verify source build completed before recovery publication
        if: inputs.source-run != ''
        env:
          SOURCE_RUN: ${{ inputs.source-run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq '.status' | grep -qx completed
          gh api --paginate "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" --jq '.jobs[]' | jq -s -e '[.[] | select(.conclusion != "success" and .conclusion != "skipped") | select(.name | startswith("packages / Build appimage ") | not)] | length == 0'
      - name: Download verified packages from original build
        if: inputs.source-run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: '{publish-*,rustdesk-ios-unsigned}'
          path: artifacts
          run-id: ${{ inputs.source-run }}
          github-token: ${{ github.token }}
      - name: Download native packages from this build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{publish-*,rustdesk-ios-unsigned}'
          path: artifacts

      - name: Check packages and write SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v1\.5\.8$ ]]
          mkdir release-assets
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            test -s "$file"
            if [[ -e "release-assets/$name" ]]; then
              cmp "$file" "release-assets/$name"
            else
              cp "$file" "release-assets/$name"
            fi
          done < <(find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.apk' -o -name '*.ipa' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.AppImage' -o -name '*.flatpak' -o -name '*.pkg.tar.zst' \
            -o -name 'rustdesk.sbom.json' \) -print0)
          cd release-assets
          for package in rustdesk-1.5.8-{x86_64,aarch64}.{msi,exe,dmg,deb} \
            rustdesk-1.5.8-{armv7,x86_64,aarch64,universal}.apk rustdesk-ios-unsigned.ipa; do
            test -s "$package"
          done
          for arch in x86_64 aarch64; do
            test -s "rustdesk-1.5.8-$arch.AppImage"
          done
          sha256sum -- * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish verified packages as one release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>release-error.log; then
            jq -e '.isDraft' existing-release.json
          else
            cat > release-notes.md <<'NOTES'
          - 修复设备列表重命名仅保存在本机的问题：登录账号后保存至个人地址簿，同账号设备登录或刷新设备列表可同步；云端名称优先于旧本地别名，清空名称也能正确同步。保存失败明确提示，保留原名称。
          - 修复硬件编码器拒绝动态码率调整时错误被忽略的问题：保留真实错误并重新初始化编码器应用目标值，不再假报成功。
          - 增加被控端限频诊断日志，区分自适应发送目标、实际发送帧率和编码目标码率；新增240帧调度回归验证。目标帧率是上限，屏幕刷新率、画面变化和编解码能力仍会限制实测值；自动码率不会强行填满网络带宽。本版本未宣称已定位或解决所有60帧限制。
          - AMD H.264/H.265 硬件编码明确使用超低延迟与速度预设，避免实时远控沿用驱动默认编码用途；同码率压缩效率可能变化。增加每15秒一次的采集、转换编码、发送等待耗时诊断；实际帧率提升仍需设备实测，不保证达到120帧。
          - 屏幕切换菜单显示编号、显示器名称和分辨率，快捷切屏支持悬停提示及切换提示。Windows 被控端读取显示器型号；旧端或读取失败时回退至系统名称和分辨率。
          - Windows 被控端上报当前显示器刷新率，帧率菜单和自定义滑块按屏幕上限生成，支持144/165/240/360Hz等模式；采集按各屏幕刷新率限速，保留手动低帧率选择。旧端及尚未上报刷新率的平台保留兼容选项。上限不代表保证达到该帧率。
          - 修复Arch Linux包版本与发布版本不一致导致最终发布被阻塞的问题。
          - 保留全部原有功能、自建服务器、背景、连接状态、帧率与码率选择、更新检查及蓝花品牌。
          - Windows 未提供受信任代码签名；macOS 未公证；Android 保留既有签名，iOS IPA 需自行签名。下载后可使用 SHA256SUMS.txt 校验。
          NOTES
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "蓝花远控 BlueBloom Remote ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release view "$RELEASE_TAG" --json databaseId,targetCommitish > release.json
          jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' release.json
          release_id=$(jq -er '.databaseId' release.json)
          gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" > uploaded.json
          jq -r '.[].name' uploaded.json | LC_ALL=C sort > uploaded-names.txt
          ls -1 release-assets | LC_ALL=C sort > expected-names.txt
          diff -u expected-names.txt uploaded-names.txt
          while read -r digest filename; do
            remote_digest=$(jq -er --arg name "$filename" '.[] | select(.name == $name) | .digest' uploaded.json)
            test "$remote_digest" = "sha256:$digest"
          done < release-assets/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
