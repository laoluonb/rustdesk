name: Laoluowl platform packages

on:
  workflow_dispatch:
  push:
    branches: [laoluowl-client]
    paths: [.github/workflows/laoluowl-packages.yml, .github/workflows/flutter-build.yml]

permissions:
  contents: write

concurrency:
  group: laoluowl-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      artifacts-only: true
      upload-tag: laoluowl-build
